name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      # Shared runners are too noisy for the timing bounds; they are reported, not asserted.
      PROCESS_TREE_GUARD_TIMING: info
      # The version resources are linked only for the MSVC target, so a run that did not link them fails.
      PROCESS_TREE_GUARD_REQUIRE_RESOURCES: '1'
      # The checks of the sign-in prompts that need a window station or a pseudo console run here and fail if the runner
      # cannot make one. They are named one by one: a general variable such as CI is set on machines where a person sits.
      PROCESS_TREE_GUARD_RUN_DESKTOP_PROMPT_TEST: '1'
      PROCESS_TREE_GUARD_REQUIRE_WINDOW_STATION: '1'
      PROCESS_TREE_GUARD_REQUIRE_PSEUDO_CONSOLE: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --release --locked
      - name: Check the version resources of the built programs
        shell: pwsh
        run: |
          $expected = [ordered]@{
            'process-tree-guard.exe' = 'Process Tree Guard'
            'process-tree-guard-deadline.exe' = 'Process Tree Guard: Deadline'
            'process-tree-guard-gate.exe' = 'Process Tree Guard: Gate'
            'process-tree-guard-contain.exe' = 'Process Tree Guard: Contain'
          }
          $failed = $false
          foreach ($name in $expected.Keys) {
            $info = (Get-Item "target/release/$name").VersionInfo
            "{0}: description '{1}', product '{2}', version '{3}', original name '{4}'" -f $name, $info.FileDescription, $info.ProductName, $info.FileVersion, $info.OriginalFilename
            if ($info.FileDescription -ne $expected[$name] -or $info.ProductName -ne 'Process Tree Guard' -or $info.OriginalFilename -ne $name -or [string]::IsNullOrEmpty($info.FileVersion)) {
              $failed = $true
            }
          }
          if ($failed) { throw 'a program does not carry its version resource' }
      - name: Test
        run: cargo test --release --locked --no-fail-fast
      - name: Version resource checks, shown
        run: cargo test --release --locked --test guard g39 -- --nocapture

  # The lowest Rust version the crate declares in Cargo.toml (rust-version) is the one checked here,
  # so the declaration cannot drift from what builds.
  minimum-rust:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
      - name: Install the declared Rust version
        shell: pwsh
        run: |
          $declared = (Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "declared rust-version: $declared"
          rustup toolchain install $declared --profile minimal --target x86_64-pc-windows-msvc
          "RUST_MSRV=$declared" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Check the library and the programs
        run: cargo "+$env:RUST_MSRV" check --release --locked --lib --bins
