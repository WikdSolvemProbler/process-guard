[package]
name = "process-tree-guard"
version = "2.0.0-alpha.5"
edition = "2021"
rust-version = "1.78"
description = "Windows process tree deadline: runs one command under a job object and kills the whole tree at a finite timeout."
license = "Apache-2.0"
repository = "https://github.com/WikdSolvemProbler/process-guard"
readme = "README.md"
keywords = ["windows", "process", "timeout", "job-object", "sandbox"]
categories = ["command-line-utilities", "os::windows-apis"]
publish = false
build = "build.rs"
autobins = false

[lib]
name = "process_tree_guard"
path = "src/lib.rs"

# The full command, installed in bin.
[[bin]]
name = "process-tree-guard"
path = "src/main.rs"

# The deadline role, installed in libexec.
[[bin]]
name = "process-tree-guard-deadline"
path = "src/bin/process-tree-guard-deadline.rs"

# The hook role, installed in libexec.
[[bin]]
name = "process-tree-guard-gate"
path = "src/bin/process-tree-guard-gate.rs"

# The contain role, installed in libexec.
[[bin]]
name = "process-tree-guard-contain"
path = "src/bin/process-tree-guard-contain.rs"

# The test helper executable. It is built only for a test run, which turns the feature on
# through the development dependency below; `cargo build` and `cargo install` do not build it.
[[bin]]
name = "testkit"
path = "src/bin/testkit.rs"
required-features = ["testkit"]

[features]
testkit = []

[dev-dependencies]
process-tree-guard = { path = ".", features = ["testkit"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
